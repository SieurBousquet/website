  page-footer:
    background: "#E2A3FF"
    border: true
    left: "2026 Augustin Bousquet."
    right: "Made with Quarto"
  navbar:
    background: "#8C14A6"
    right:
      - text: CV
        href: CV.qmd
      - icon: github
        href: https://github.com/SieurBousquet
      - text: "Academic"
        icon: envelope-at
        href: "mailto:augustin.bousquet4@etu.univ-lorraine.fr"
      - text: "Personal"
        icon: envelope-at-fill
        href: "mailto:augustin.bousquet@protonmail.ch"
format:
  html:
    respect-user-color-scheme: true
    theme:
      - cosmo
      - styles.scss
    highlight-style: atom-one  # (radical, atom-one, tango), a11y, arrow function well
